services:
  crosshub-java:
    image: crosshub-java:latest
    container_name: crosshub-java
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:18080"
    # 共用上货站运维账号（自动上货 BFF 代登）；文件在 /data/crosshub/.commander.env
    env_file:
      - .commander.env
    volumes:
      - /data/crosshub/data:/data
      - /data/crosshub/python-src:/opt/crosshub/python:ro
      - /data/crosshub/browser-profile:/data/temu-browser-profile
      - /data/crosshub/agent-profiles:/data/agent-profiles
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      CROSSHUB_DB_PATH: /data/crosshub.db
      CROSSHUB_AGENT_PROFILES_ROOT: /data/agent-profiles
      CROSSHUB_JWT_SECRET: "${CROSSHUB_JWT_SECRET:?Set CROSSHUB_JWT_SECRET to a random 32+ byte value}"
      CROSSHUB_DATA_SECRET: "${CROSSHUB_DATA_SECRET:?Set CROSSHUB_DATA_SECRET to a random 32+ byte value}"
      CROSSHUB_SAU_EXCHANGE_SECRET: "${CROSSHUB_SAU_EXCHANGE_SECRET:?Set CROSSHUB_SAU_EXCHANGE_SECRET to the SAU exchange secret}"
      CROSSHUB_CORS_ALLOWED_ORIGIN_PATTERNS: "${CROSSHUB_CORS_ALLOWED_ORIGIN_PATTERNS:-https://www.yoto.work}"
      CROSSHUB_DEMO_SEED_ENABLED: "${CROSSHUB_DEMO_SEED_ENABLED:-false}"
      CROSSHUB_CRAWLER_USE_AGENT: "true"
      CROSSHUB_PYTHON: python3
      CROSSHUB_PYTHON_DIR: /opt/crosshub/python
      TEMU_PROFILE_ROOT: /data/temu-browser-profile
      TEMU_HEADLESS: "1"
      TEMU_BROWSER_CHANNEL: ""

  crosshub-express:
    image: crosshub-express:latest
    container_name: crosshub-express
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:18081"
    environment:
      PORT: "18081"

  crosshub-python-worker:
    image: crosshub-python-worker:latest
    container_name: crosshub-python-worker
    restart: unless-stopped
    depends_on:
      - crosshub-java
    volumes:
      - /data/crosshub/data:/data
      - /data/crosshub/evidence:/evidence
      - /data/crosshub/reports:/reports
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      CROSSHUB_DB_PATH: /data/crosshub.db
      CROSSHUB_MONITOR_EVIDENCE_DIR: /evidence
      CROSSHUB_SNAPSHOT_PROVIDER_MODE: ctf_page_card
