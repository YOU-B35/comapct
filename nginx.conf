events {
    worker_connections 1024;
}

http {
    upstream java_api {
        server 127.0.0.1:18080;
    }

    upstream express_api {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 50M;

        # 静态前端（生产构建版）
        location /crosshub/ {
            alias D:/YOTO-SASS/SaaS-HZ_WEB_Demo/dev/vue-site/dist/;
            try_files $uri $uri/ /crosshub/index.html;
        }

        # Java API 代理
        location /api/temu/ {
            proxy_pass http://java_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/auth/ {
            proxy_pass http://java_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/warehouse/ {
            proxy_pass http://java_api;
            proxy_set_header Host $host;
        }

        location /api/tenant/ {
            proxy_pass http://java_api;
            proxy_set_header Host $host;
        }

        location /api/platform-accounts/ {
            proxy_pass http://java_api;
            proxy_set_header Host $host;
        }

        location /api/aliexpress/ {
            proxy_pass http://java_api;
            proxy_set_header Host $host;
        }

        location /api/amazon/ {
            proxy_pass http://java_api;
            proxy_set_header Host $host;
        }

        location /api/agent/ {
            proxy_pass http://java_api;
            proxy_set_header Host $host;
        }

        location /api/monitor/ {
            proxy_pass http://java_api;
            proxy_set_header Host $host;
        }

        location /api/tasks/ {
            proxy_pass http://java_api;
            proxy_set_header Host $host;
        }

        location /api/ops-feedback/ {
            proxy_pass http://java_api;
            proxy_set_header Host $host;
        }

        location /api/sync-logs {
            proxy_pass http://java_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Express 其他 API
        location /api/ {
            proxy_pass http://express_api;
            proxy_set_header Host $host;
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 "OK";
        }
    }
}
