<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopify 批量上货工具</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app">
      <section class="toolbar">
        <div>
          <h1>Shopify 批量上货</h1>
          <p id="configStatus">读取配置中...</p>
        </div>
        <div class="actions">
          <label class="file-button">
            <input id="fileInput" type="file" accept=".xlsx,.xls">
            选择 Excel
          </label>
          <button id="uploadBtn">解析模板</button>
          <button id="checkShopifyBtn">测试 Shopify</button>
          <button id="dryRunBtn" disabled>Dry Run</button>
          <button id="generateBtn" disabled>生成 AI 图片</button>
          <button id="publishBtn" disabled>上架为草稿</button>
        </div>
      </section>

      <section class="summary" id="summary"></section>

      <section class="layout">
        <aside>
          <h2>商品列表</h2>
          <div id="productList" class="product-list"></div>
        </aside>
        <section class="detail" id="detail">
          <div class="empty">上传模板后会在这里预览商品、变体和图片状态。</div>
        </section>
      </section>

      <section class="product-editor">
        <div class="editor-header">
          <div>
            <h2>已上架商品属性修改</h2>
            <p>从 Shopify 拉取商品，勾选单个或多个商品后，只更新已选择的属性。</p>
          </div>
          <div class="editor-search">
            <input id="shopifyProductSearch" type="search" placeholder="搜索标题、handle、标签">
            <button id="loadShopifyProductsBtn">刷新商品</button>
          </div>
        </div>
        <div class="editor-grid">
          <div class="shopify-products">
            <div class="selection-bar">
              <label><input id="selectAllShopifyProducts" type="checkbox"> 全选当前列表</label>
              <span id="selectedShopifyCount">已选 0 个</span>
            </div>
            <div id="shopifyProductList" class="shopify-product-list">
              <div class="empty small">点击刷新商品后选择要修改的 Shopify 商品。</div>
            </div>
          </div>
          <form id="productUpdateForm" class="update-form">
            <label class="field-row">
              <input name="updateStatus" type="checkbox">
              <span>状态</span>
              <select name="status">
                <option value="DRAFT">草稿</option>
                <option value="ACTIVE">公开</option>
                <option value="ARCHIVED">归档</option>
              </select>
            </label>
            <label class="field-row">
              <input name="updateProductType" type="checkbox">
              <span>产品类型</span>
              <input name="productType" type="text" placeholder="例如：钓鱼用具">
            </label>
            <label class="field-row">
              <input name="updateVendor" type="checkbox">
              <span>Vendor</span>
              <input name="vendor" type="text" placeholder="供应商/品牌">
            </label>
            <label class="field-row">
              <input name="updateTags" type="checkbox">
              <span>标签</span>
              <input name="tags" type="text" placeholder="用英文逗号分隔">
            </label>
            <label class="field-row">
              <input name="updateVariantPrice" type="checkbox">
              <span>所有变体价格</span>
              <input name="variantPrice" type="number" min="0" step="0.01" placeholder="0.00">
            </label>
            <label class="field-row wide">
              <input name="updateTitle" type="checkbox">
              <span>标题</span>
              <input name="title" type="text" placeholder="批量选择时会把所有商品改成同一标题">
            </label>
            <label class="field-row wide">
              <input name="updateDescriptionHtml" type="checkbox">
              <span>描述 HTML</span>
              <textarea name="descriptionHtml" rows="5" placeholder="<p>新的商品描述</p>"></textarea>
            </label>
            <button id="applyProductUpdateBtn" type="submit">修改选中商品</button>
          </form>
        </div>
      </section>

      <section class="log">
        <h2>运行日志</h2>
        <pre id="log"></pre>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
