server:
  port: 18080

crosshub:
  jwt-secret: crosshub-dev-secret-change-in-production
  db-path: ${CROSSHUB_DB_PATH:../data/crosshub.db}
  agent:
    concurrency:
      # 16GB 机器默认：Temu≤3 / AE≤2 / Amazon≤1 / 全局≤5；按 session_key·browser_id 互斥
      max-temu: ${CROSSHUB_AGENT_MAX_TEMU:3}
      max-aliexpress: ${CROSSHUB_AGENT_MAX_AE:2}
      max-amazon: ${CROSSHUB_AGENT_MAX_AMAZON:1}
      max-global: ${CROSSHUB_AGENT_MAX_GLOBAL:5}
      max-claim-batch: ${CROSSHUB_AGENT_MAX_CLAIM:5}
      temu-parallel-sessions: ${CROSSHUB_AGENT_TEMU_PARALLEL:3}
    profiles:
      enabled: true
      root: ${CROSSHUB_AGENT_PROFILES_ROOT:./backend/data/agent-profiles}
      max-bytes: 10485760
  crawler:
    python-executable: ${CROSSHUB_PYTHON:py}
    script-dir: ${CROSSHUB_PYTHON_DIR:../python}
    timeout-seconds: 300
    allow-seed: false
    use-agent: ${CROSSHUB_CRAWLER_USE_AGENT:true}
    daily-sync:
      # 全平台日批（Temu / 速卖通 / Amazon），每天 09:30 Asia/Shanghai
      enabled: ${CROSSHUB_TEMU_DAILY_SYNC:true}
      cron: "0 30 9 * * *"
      zone: Asia/Shanghai

spring:
  codec:
    max-in-memory-size: 12MB
  datasource:
    url: jdbc:sqlite:${crosshub.db-path}?busy_timeout=30000
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: "PRAGMA busy_timeout=30000; PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL;"
      maximum-pool-size: 8
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  jackson:
    property-naming-strategy: SNAKE_CASE
