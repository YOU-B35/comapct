server:
  port: 18080

crosshub:
  jwt-secret: ${CROSSHUB_JWT_SECRET}
  data-secret: ${CROSSHUB_DATA_SECRET:${crosshub.jwt-secret}}
  db-path: ${CROSSHUB_DB_PATH:/data/crosshub/data/crosshub.db}
  demo-seed:
    enabled: ${CROSSHUB_DEMO_SEED_ENABLED:false}
  cors:
    allowed-origin-patterns: ${CROSSHUB_CORS_ALLOWED_ORIGIN_PATTERNS:https://www.yoto.work}
  sau:
    exchange-secret: ${CROSSHUB_SAU_EXCHANGE_SECRET}
    link-username: ${CROSSHUB_SAU_LINK_USERNAME:}
  crawler:
    python-executable: ${CROSSHUB_PYTHON:python3}
    script-dir: ${CROSSHUB_PYTHON_DIR:/opt/crosshub/python}
    timeout-seconds: 300
    allow-seed: false
    use-agent: ${CROSSHUB_CRAWLER_USE_AGENT:true}
    daily-sync:
      enabled: ${CROSSHUB_TEMU_DAILY_SYNC:true}
      cron: "0 30 9 * * *"
      zone: Asia/Shanghai
spring:
  datasource:
    url: jdbc:sqlite:${crosshub.db-path}?busy_timeout=30000
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: "PRAGMA busy_timeout=30000; PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL;"
      maximum-pool-size: 8
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  jackson:
    property-naming-strategy: SNAKE_CASE
